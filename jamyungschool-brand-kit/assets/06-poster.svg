<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Jamyung School brand asset">
  <defs>
    <style>
      .kr { font-family: "Noto Serif KR", "Noto Sans KR", "Malgun Gothic", serif; }
      .sans { font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; }
      .brand { fill: #36204F; }
      .plum { fill: #5A347A; }
      .ink { fill: #242128; }
      .muted { fill: #8B8178; }
      .gold { fill: #C8A96B; }
      .small { font-size: 24px; letter-spacing: 0; }
    </style>
    <linearGradient id="softPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36204F"/>
      <stop offset="100%" stop-color="#5A347A"/>
    </linearGradient>
    <pattern id="quietGrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#D8CDE8" stroke-width="1" opacity=".42"/>
    </pattern>
  </defs>
  
  <rect width="1080" height="1350" fill="#F7F1E8"/>
  <rect x="58" y="58" width="964" height="1234" rx="34" fill="#FFFDF8" stroke="#D8CDE8" stroke-width="2"/>
  <rect x="58" y="58" width="964" height="328" rx="34" fill="#36204F"/>
  <path d="M58 314C256 218 473 353 1022 160V386H58Z" fill="#5A347A" opacity=".72"/>
  <text x="112" y="170" class="sans" fill="#F7F1E8" font-size="31" font-weight="700">JAMYUNG SCHOOL</text>
  <text x="112" y="258" class="kr" fill="#F7F1E8" font-size="72" font-weight="850">AI로 여는</text>
  <text x="112" y="336" class="kr" fill="#F7F1E8" font-size="72" font-weight="850">나의 두 번째 일</text>
  <text x="112" y="494" class="kr brand" font-size="46" font-weight="800">40~60대를 위한 실전 AI 콘텐츠 클래스</text>
  <text x="112" y="570" class="sans ink" font-size="31">챗GPT 활용, 콘텐츠 기획, 전자책/강의자료 제작,</text>
  <text x="112" y="614" class="sans ink" font-size="31">1인 비즈니스 구조 설계까지 한 흐름으로 배웁니다.</text>
  <rect x="112" y="700" width="856" height="260" rx="22" fill="#F7F1E8" stroke="#D8CDE8" stroke-width="2"/>
  <text x="160" y="770" class="sans brand" font-size="30" font-weight="800">이런 분께 맞습니다</text>
  <text x="160" y="830" class="sans ink" font-size="28">01  AI를 배우고 싶지만 어디서 시작할지 막막한 분</text>
  <text x="160" y="884" class="sans ink" font-size="28">02  경험을 콘텐츠와 강의로 바꾸고 싶은 분</text>
  <text x="160" y="938" class="sans ink" font-size="28">03  퇴직 후 새로운 수익 구조를 만들고 싶은 분</text>
  <text x="112" y="1060" class="sans ink" font-size="30">일정  [입력 필요]     장소  [입력 필요]</text>
  <text x="112" y="1112" class="sans ink" font-size="30">수강료  [확인 필요]   신청  [링크 입력 필요]</text>
  <rect x="112" y="1182" width="430" height="82" rx="12" fill="#36204F"/>
  <text x="327" y="1235" text-anchor="middle" class="sans" fill="#F7F1E8" font-size="31" font-weight="800">상담 / 신청하기</text>
  <text x="600" y="1233" class="kr brand" font-size="39" font-weight="800">자명스쿨</text>

</svg>
