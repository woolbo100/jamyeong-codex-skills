<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>자명스쿨 브랜드 비주얼 키트</title>
  <style>
    body {
      margin: 0;
      background: #f7f1e8;
      color: #242128;
      font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
    }
    header {
      padding: 56px 6vw 32px;
      background: #36204f;
      color: #fffdf8;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 68px);
      letter-spacing: 0;
      font-family: "Noto Serif KR", "Malgun Gothic", serif;
    }
    header p {
      margin: 0;
      color: #d8cde8;
      font-size: 20px;
    }
    main {
      padding: 34px 6vw 80px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }
    figure {
      margin: 0;
      background: #fffdf8;
      border: 1px solid #d8cde8;
      border-radius: 8px;
      overflow: hidden;
    }
    figure.wide {
      grid-column: 1 / -1;
    }
    img {
      width: 100%;
      display: block;
      background: #fffdf8;
    }
    figcaption {
      padding: 12px 14px 16px;
      font-size: 15px;
      color: #5a347a;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <h1>자명스쿨 Purple Archive</h1>
    <p>AI · 콘텐츠 · 1인 비즈니스 교육 브랜드 비주얼 키트</p>
  </header>
  <main>
    <section class="grid">
      <figure class="wide"><img src="assets/00-logo-master.svg" alt="로고 마스터"><figcaption>00 로고 마스터: 먼저 확정해서 모든 자산에 적용</figcaption></figure>
      <figure class="wide"><img src="assets/01-logo-horizontal.svg" alt="가로형 로고"><figcaption>01 가로형 로고</figcaption></figure>
      <figure class="wide"><img src="assets/01A-logo-horizontal-transparent.svg" alt="투명 배경 가로 로고"><figcaption>01A 투명 배경 가로 로고: 문서, 상세페이지, 썸네일에 얹어 쓰는 용도</figcaption></figure>
      <figure class="wide"><img src="assets/01B-logo-horizontal-white.svg" alt="흰색 가로 로고"><figcaption>01B 흰색 로고: 어두운 배경에 얹어 쓰는 용도</figcaption></figure>
      <figure><img src="assets/02-logo-symbol-profile.svg" alt="SNS 프로필"><figcaption>02 SNS 프로필</figcaption></figure>
      <figure><img src="assets/02A-logo-symbol-transparent.svg" alt="투명 배경 심볼 로고"><figcaption>02A 투명 배경 심볼 로고</figcaption></figure>
      <figure><img src="assets/03-business-card-front.svg" alt="명함 앞면"><figcaption>03 명함 앞면</figcaption></figure>
      <figure><img src="assets/04-business-card-back.svg" alt="명함 뒷면"><figcaption>04 명함 뒷면</figcaption></figure>
      <figure class="wide"><img src="assets/05-sns-banner.svg" alt="SNS 배너"><figcaption>05 SNS/유튜브 배너</figcaption></figure>
      <figure><img src="assets/06-poster.svg" alt="홍보 포스터"><figcaption>06 홍보 포스터</figcaption></figure>
      <figure><img src="assets/07-carousel-01-hook.svg" alt="카드뉴스 1"><figcaption>07 카드뉴스 1</figcaption></figure>
      <figure><img src="assets/08-carousel-02-problem.svg" alt="카드뉴스 2"><figcaption>08 카드뉴스 2</figcaption></figure>
      <figure><img src="assets/09-carousel-03-insight.svg" alt="카드뉴스 3"><figcaption>09 카드뉴스 3</figcaption></figure>
      <figure><img src="assets/10-carousel-04-solution.svg" alt="카드뉴스 4"><figcaption>10 카드뉴스 4</figcaption></figure>
      <figure><img src="assets/11-carousel-05-cta.svg" alt="카드뉴스 5"><figcaption>11 카드뉴스 5</figcaption></figure>
      <figure class="wide"><img src="assets/12-visual-style-board.svg" alt="스타일 보드"><figcaption>12 스타일 보드</figcaption></figure>
      <figure class="wide"><img src="assets/13-representative-visual.png" alt="대표 비주얼"><figcaption>13 대표 비주얼</figcaption></figure>
    </section>
  </main>
</body>
</html>
